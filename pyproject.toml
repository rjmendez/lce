[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lce"
version = "0.1.0"
description = "AI photo enhancement plugin for LightCraft — open-source, open weights"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "openvino>=2024.0",
    "onnxruntime>=1.17",
    "scipy>=1.12",
    "tomllib; python_version < '3.11'",
]

[project.optional-dependencies]
serve = ["fastapi>=0.111", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
dev   = ["pytest>=8", "pytest-mock>=3.12"]

[project.scripts]
lce-serve   = "lce.server:main"
lce-weights = "lce.weights.download:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
