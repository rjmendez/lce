# lce model registry - open-weight ONNX models.
# Every entry pins sha256 and size_bytes (values taken from the Hugging Face
# file listing and re-computed on the downloaded file). The registry refuses
# an entry with an empty sha256, verifies the digest before a download is
# moved into place, and checks size_bytes whenever a cached file is reused.
# URLs were checked to exist on 2026-10-20.

[[model]]
id          = "hat-sentinel-x4"
capability  = "upscale"
url         = "https://huggingface.co/ArturWoz/HAT-Sentinel-onnx/resolve/main/HAT_SRx4_Sentinel.onnx"
sha256      = "6ffbe222f76d0a7113a24e2cedb3231ed6afe600489e6cf03e5570811cbb5d23"
size_bytes  = 160967438
format      = "onnx"
license     = "unspecified"
description = "HAT 4x super-resolution (full HAT, not HAT-S), fine-tuned on Sentinel-2 satellite imagery; fixed 64x64 input. The model card states no license (upstream HAT is Apache-2.0); quality on ordinary photos is not established."
optional    = false

